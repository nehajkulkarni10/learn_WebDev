<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while loop</title>
</head>
<body>
    <script>
        //2. While loop - Entry controlled loop

        //while(condition) - when condition is true, loops start & when condition is false loop ends/stops

        let count = 1

        while(count <= 5){
            console.log("hello")
            count++

        }

        //3. Do While loop - Exit controlled loop

        // It will execute the code atleast 1 time - even though condition is false.

        let num = 7

        do{

            console.log('Hello How are you')

        }while(num<=5)
    </script>
</body>
</html>
