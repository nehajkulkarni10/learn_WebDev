<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Display</title>
    <style>

        .store{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* repeat(no. of columns, size of each column). 12 columns is maximum not more than that. */
            gap: 25px;
            background-color: lightblue;
        }

        .product{
            background-color: palevioletred;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <div class="store">
        <div class="product 1">product 1</div>
        <div class="product 2">product 2</div>
        <div class="product 3">product 3</div>
        <div class="product 4">product 4</div>
        <div class="product 5">product 5</div>
        <div class="product 6">product 6</div>

    </div>
</body>
</html>
