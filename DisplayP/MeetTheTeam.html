<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team</title>
    <style>
        body{
            font-family: monospace;
            background-color: #f4f4f4;
            margin: 0 ;
        }

        h1{
            text-align: center;
            color: #333;
            margin-bottom: 30px;

        }

        .team{
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            /* flex-wrap : wrap; - allows us to see the website in any device clearly.
            Note: to check that - right click on website - Inspect - Check 
            */
        }

        .card{
            border: 1px solid black;
            border-radius: 12px;
            background-color: lightseagreen;
            width: 220px;
            text-align: center;
            padding: 20px;
            color: white;
        }

        .card img{
            border-radius: 50%;
        }

        .card button{
            padding: 10px;
            border: none;
            background-color: lightcoral;
            border-radius: 15px;
            color: white;
        }


    </style>
</head>
<body>
    <h1>Meet Our Awesome Team</h1>

    <div class="team">

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQu8QUg_Wa25d6DHXDOt9ep7Gn8fCFtFQVRGcdin8gD2g&s=10" height="200px" width="200px">
            <h2>Abhinav</h2>
            <p>UI UX Developer</p>
            <button>LinkedIn</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcST0tprRqh9tfZXm2XLpw1jK9bDBgOMfeCw3Lug5TUHlA&s=10" height="200px" width="200px">
            <h2>Vaishnavi</h2>
            <p>Backend Developer</p>
            <button>LinkedIn</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxYwuSDxH-_JcUgYFTRvf58px6cA6fsowNmt5Znhwq0Q&s=10" height="200px" width="200px">
            <h2>Nishchay</h2>
            <p>Frontend Developer</p>
            <button>LinkedIn</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3hIV0YkPTrBHgKdXi6BORSmqk_XPyORdZBBwBZfZOtA&s=10" height="200px" width="200px">
            <h2>Resham</h2>
            <p>AI Developer</p>
            <button>LinkedIn</button>
        </div>


    </div>
</body>
</html>
