<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select>
        <option>English</option>
        <option label="usa">United States of America</option>
        <option>Hindi</option>
        <option>Kannada</option>
        <option>Tamil</option>
        <option>Marathi</option>
        <option>Telugu</option>
        <option label="Malm">Malayalam</option>
        <option selected>Language</option> 
        <option disabled>French</option>
    </select>

    <!-- Selected attribute is used to keep that option at the top. -->
    <!-- Disabled attribute is to disable the option for some period of time. -->
    <!-- Label attribute is used for short form of long words used.  -->
</body>
</html>
