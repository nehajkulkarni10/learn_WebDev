<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Video Tag - used to add video. Extension preferred is "mp4"-->
     <!-- Source Tag - Used to add the source of the video -->
    <!-- Basic Syntax -->
    <!-- <video>
        <source src="Location/Address" type="video/mp4">
    </video> -->
    <!-- Two platforms to get source - 1.Pexels 2. Pixabay -->

    <video controls loop autoplay height="800" width="1000">
        <source src="https://www.pexels.com/download/video/38103674/" type="video/mp4">
    </video>

    <!-- Audio mp3 -->
     <!-- In audio tag, controls is mandatory. We can use autoplay and loop in audio tag but not height and width. -->

    <audio controls>
        <source src="./ikoliks_aj-background-music-320427.mp3" type="audio/mp3">
    </audio>

    <!-- Shortcut - To access files in the current folder just press "./" and tadaa u will see the file -->
</body>
</html>
