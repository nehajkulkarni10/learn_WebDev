<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Div - It is a block level tag / 100% width of the space.  -->
    <!-- by default div tag is acting like a blocks/bricks. We can use any other html tag in it. -->
     <!-- 100% width of the space. -->


    <div style="background-color: lightblue;">
        <h2>Menu</h2>
        <ol>
            <li>Pizza</li>
            <li>Coke</li>
        </ol>
    </div>

    <div style="background-color: bisque;">
        <h2>Review</h2>
        <strong>Good Restraunt</strong>
        <p>_Sarah⭐️⭐️⭐️⭐️⭐️</p>

    </div>

    <!-- Span Tag - It takes required amount of width. -->
     <!-- Also k/a "INLINE TAG / ELEMENT" -->
      <!-- It can added inside any other html tag -->
    
    <span style="background-color: brown;">Login</span>
    <button>Cart</button>
</body>
</html>
