<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Prepare a list for Grocery shopping -->

    <!-- Ordered List -->
     <!-- Default type of ol tag is numbers -->
     <!-- Attribute to change the order is "TYPE" -->
     <ol type="i">
        <li>Milk</li>
        <li>Bread</li>
        <li>Egg</li>
     </ol>

     <!-- Unordered list -->
    <ul type="square">
        <li>Milk</li>
        <li>Bread</li>
        <li>Egg</li>
    </ul>

    <ul type="circle">
        <li>Milk</li>
        <li>Bread</li>
        <li>Egg</li>
    </ul>

    <ul type="sphere">
        <li>Milk</li>
        <li>Bread</li>
        <li>Egg</li>
    </ul>
</body>
</html>
