<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Input and label tag-->

    <label>Username</label>
    <input placeholder="Enter Your Username"> <br><br> 
    <!-- br br twice bcoz one skips and other on next line. and placeholder to avoid separate labels as it shows inside input box. -->

    <label>Email ID</label>
    <input type="email" placeholder="Enter Your Email ID "><br><br> 
    <!-- Type: means what kind of input webpage want -->

    <label>Password</label>
    <input type="password" placeholder="Enter Your Password"><br><br> 

    <label>Date Of Birth</label>
    <input type="date"><br><br> 

    <label>Resume</label>
    <input type="file"><br><br> 

    <label>Phonenumber</label>
    <input type="number"><br><br> 

    <mark>Accept Terms and Condition</mark> <input type="checkbox"><br><br> 

    <label>Reviews</label>
    <!-- textarea tag will help u get multiple line of inputs -->
    <!-- to change 1. width=columns, 2. height=rows -->
    <textarea cols="25" rows="20">


</body>
</html>
