    <title>Youtube Video & Google Maps</title>

<body>
    <!-- 2. COPY EMBEDDED CODE FROM YT. IN VSCODE PASTE IT -->
     <!-- Iframe tag: gets resourses from 3rd party platforms like yt -->

    <h2>Restaurant Ad</h2>
    <!-- go to 3rd party platforms like yt, search for required video, open video and right click on it, cthen option 'copy embeded link and paste in vs code' -->

    <iframe width="996" height="560" src="https://www.youtube.com/embed/qWZS3jNkkyo" title="Restaurant Ad Video Template (Editable)" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <hr>

    <h2>Google map</h2>
