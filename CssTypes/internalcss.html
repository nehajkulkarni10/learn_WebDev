<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Syntax - tagname{
        Css Prop
        } */

        h1{
            color: brown;
            text-align: center;
        }

        div{
            background-color: orange;
            width: 250px;
            text-align: center;
            border: 1px solid;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 0 15px black;
        }

        div img{
            width: 250px;
            border-radius: 12px
        }

        div h2{
            font-size: 24px;
            font-family: monospace;
        }

        div button{
            background-color: dimgray;
            padding: 15px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
        }


    </style>
</head>
<body>
    <!-- Internal CSS - inside the HTML using style Tag. IN HEAD SECTION. -->

    <h1>Profile Card</h1>

    <div>
        <img src="https://img.magnific.com/premium-vector/male-face-avatar-icon-set-flat-design-social-media-profiles_1281173-3806.jpg?semt=ais_hybrid&w=740&q=80">
        <h2>Abhinav</h2>
        <p>FullStack Developer</p>
        <button>LinkedIn</button>
    </div>

    <img width: 250px src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB4r8C1sEb7hQOoXNoIJ1akwjTmZPn8y2ryPe_jmMTLQ&s=10">
</body>
</html>
