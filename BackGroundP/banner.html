<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            border: 1px solid black;
            height: 1000px;
            text-align: center;
            font-size: 30px;
            text-shadow: 0 2px 4px black;
            color: white;

            background-color: bisque;
            /* background-image: url('Address/Link'); */
            background-image: url('https://images.pexels.com/photos/36484101/pexels-photo-36484101.jpeg');

            background-repeat: no-repeat;

            background-size: cover;
            background-position: center;

            /* filter: blur(1px); */
            filter: brightness(120%);
        }


    </style>
</head>
<body>
    <div class="banner">
        <h2>Cafe . Coffee ☕️ </h2>
    </div>
</body>
</html>
