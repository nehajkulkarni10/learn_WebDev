<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
</head>
<body>
    <button id="btn">Add to Cart</button>

    <p id="msg"></p>

    <script>
        const button = document.getElementById("btn")

        const message = document.getElementById("msg")

        //addEventListner() :

        //TagName/Variable.addEventListner('Type of Event', Task) 

        //addEventListner() - capture the action performed by the user.

        button.addEventListener('click', function(){      // dbclick - for double click to get output.

            message.textContent = "Product Added"
        })


    </script>
</body>
</html>
