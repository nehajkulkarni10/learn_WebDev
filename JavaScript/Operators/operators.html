<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        //1. Arithmetic Operators : +, -, *, /, //, %
        
        var x = 10
        var y = 7

        console.log(x+y)
        console.log(x-y)
        console.log(x*y)
        console.log(x/y)
        console.log(x%y)

        //modulo - remainder

        console.log(10%5) // 0

        console.log(12%5) // 2

        // left num < right num in the modulo, the remainder is the left num.

        console.log(2%9) // 2

        console.log(1%8) // 1

    </script>
</body>
</html>
