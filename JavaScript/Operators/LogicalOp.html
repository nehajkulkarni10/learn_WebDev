<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //2. Logical Operator 

        // i. AND operator - && - If both condition is true then o/p is true

        var isMember = true
        let TotalPrice = 300

        // console.log(isMember && TotalPrice > 500) - False

        console.log(isMember && TotalPrice > 200)

        // ii. OR operator - || - If one condition is true then o/p is true

        console.log(isMember || TotalPrice > 500)

        //iii. Neagtion - ! :- Opposite Value

        let netflixSub = false
        console.log(!netflixSub)


        //iv. Comaprison - Two Value

        const a = 10 // number
        const b = "10" // string

        // == Compare value ~ both value are same, o/p is true
        console.log(a == b) // true

        // === compare value and datatypes - both are same
        console.log(a === b) // false



        
        
    </script>
</body>
</html>
