<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
</head>
<body>


    <script>

        // Array - used to store multiple data/ value at one time which 
        //Advantage - can be of different datatypes.
        // In Array we have individual data.
        //[ ] - Represented in sq bracket.

        //Rule : Index number starts with zero.

        let student = [ "Abhinav", "Raghav","Ram", "Siya", "Neha"]
        // Index Number - 0 , 1 , 2 , 3, 4 
        console.log(student)

        //Access a single data from array.
        // ArrayName[IndexNumber]

        console.log(student[4])

        // Products

        let products = ["Mobile", 'Laptop', 'Tv', 'Fridge', 'Washing Machine']
        console.log(products)

        //Object - It is used to store Multiple Data/Value At the Same time.
        // Collection of Data.
        // Format :- key(left) : value(right) pair
        // Symbol : curly bracket {}

        let employee1 = {
            // key - vlaue pair
            name:"Aditya",
            email:"Aditya@gmail.com",
            id :1234,
            salary:60000

        }

        // How to access the value in object :- objectname.keyname
        console.log(employee1.email)



    </script>
</body>
</html>
