<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataType</title>
</head>
<body>

    <h1>Data Types In JavaScript</h1>

    

    <script>

        // Datatypes - Types of Data

        // 1. String = Text inside " " or ' '

        var username = "John"
        console.log(username)

        // Check the datatype of any value - typeof(variablename)
        console.log(typeof(username))

        var password = "1234"
        console.log(password)
        console.log(typeof(password))

        //2. Number : +ve, -ve, decimal number - Every number is a number datatype
        // write numbers directly. No quotes needed

        var age = 34
        console.log(age)
        console.log(typeof(age))

        //3. Boolean : When the value is true / false

        var isSubscribe = 'false'
        console.log(typeof(isSubscribe))

        var isLoggedIn = true
        console.log(typeof(isLoggedIn))

        //4. Undefined Datatype - when no value is assigned

        var a
        console.log(a)
        console.log(typeof(a))

        //5. Null datatype - Nothing -- Due to early bug in JS, Datatype of null it shows Object. And it is not fixed yet.

        var b = null
        console.log(b)
        console.log(typeof(b))


    </script>
</body>
</html>
